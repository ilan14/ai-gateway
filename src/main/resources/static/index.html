<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Gateway 调试</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #242424;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-right: auto;
    }

    .toolbar label {
      font-size: 13px;
      color: #aaa;
    }

    select {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: #666; }

    /* 流式开关 */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider { background: #4f8ef7; }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    /* 消息区域 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message .role {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }

    .message.user .role { color: #4f8ef7; }
    .message.assistant .role { color: #4caf82; }

    .message .content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .content {
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 8px;
    }

    /* 光标闪烁 */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #e0e0e0;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* 底部输入区 */
    .input-area {
      padding: 16px 20px;
      background: #242424;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }

    .input-wrap {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: #2e2e2e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 180px;
      overflow-y: auto;
    }

    textarea:focus { border-color: #555; }
    textarea::placeholder { color: #555; }

    button {
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      height: 44px;
    }

    button:hover { background: #3a7de8; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* 错误提示 */
    .error {
      color: #e57373;
      font-size: 13px;
      font-style: italic;
    }

    /* 空状态 */
    .empty-hint {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <h1>AI Gateway</h1>

  <label for="modelSelect">模型</label>
  <select id="modelSelect">
    <option value="">加载中…</option>
  </select>

  <div class="switch-wrap">
    <label for="streamToggle">流式</label>
    <label class="switch">
      <input type="checkbox" id="streamToggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <button id="clearBtn" style="background:#333;font-size:12px;padding:6px 12px;height:auto;">清空对话</button>
</div>

<div class="messages" id="messages">
  <div class="empty-hint" id="emptyHint">选择模型，输入问题，开始对话</div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" placeholder="输入问题，Shift+Enter 换行，Enter 发送" rows="1"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('input');
  const sendBtn     = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  const streamToggle= document.getElementById('streamToggle');
  const emptyHint   = document.getElementById('emptyHint');

  let history = [];
  let sessionId = null;
  let activeRequest = null;
  let modelsReady = false;

  function updateSendButton() {
    sendBtn.disabled = !modelsReady || !modelSelect.value || activeRequest !== null;
  }

  updateSendButton();
  (async () => {
    try {
      const res = await fetch('/v1/models');
      if (!res.ok) throw await responseError(res);
      const data = await res.json();
      const models = (data.data ?? []).filter(m => typeof m.id === 'string' && m.id.trim());
      modelSelect.replaceChildren();
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.owned_by ? `${m.id}（${m.owned_by}）` : m.id;
        modelSelect.appendChild(opt);
      });
      modelsReady = models.length > 0;
      if (!modelsReady) showModelStatus('暂无可用模型');
    } catch (err) {
      showModelStatus(`加载失败: ${err.message}`);
    } finally {
      updateSendButton();
    }
  })();

  function showModelStatus(text) {
    const option = document.createElement('option');
    option.value = '';
    option.textContent = text;
    modelSelect.replaceChildren(option);
  }

  modelSelect.addEventListener('change', updateSendButton);
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);
  document.getElementById('clearBtn').addEventListener('click', () => {
    activeRequest?.controller.abort();
    activeRequest = null;
    history = [];
    sessionId = null;
    messagesEl.replaceChildren(emptyHint);
    updateSendButton();
  });

  function appendMessage(role, content) {
    emptyHint.remove();
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    wrap.innerHTML = `<div class="role">${role === 'user' ? '你' : '助手'}</div>
                      <div class="content"></div>`;
    const contentEl = wrap.querySelector('.content');
    contentEl.textContent = content;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return contentEl;
  }

  async function responseError(res) {
    let detail = '';
    try {
      const body = await res.text();
      try {
        const data = JSON.parse(body);
        detail = data.error?.message ?? data.message ?? data.detail ?? '';
      } catch {
        detail = body;
      }
    } catch { /* 响应体不可读时保留 HTTP 状态 */ }
    return new Error(`HTTP ${res.status}${detail ? `：${detail}` : ''}`);
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || !modelsReady || !modelSelect.value || activeRequest) return;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    inputEl.style.height = 'auto';

    const request = { controller: new AbortController() };
    activeRequest = request;
    updateSendButton();
    const model = modelSelect.value;
    const stream = streamToggle.checked;
    const contentEl = appendMessage('assistant', '');
    const headers = { 'Content-Type': 'application/json' };
    if (sessionId && model !== 'mock') headers['X-Session-Id'] = sessionId;

    try {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers,
        body: JSON.stringify({ model, messages: history, stream }),
        signal: request.controller.signal
      });
      if (activeRequest !== request) return;
      if (!res.ok) throw await responseError(res);
      if (model !== 'mock') sessionId = res.headers.get('X-Session-Id') || sessionId;
      const reply = stream
        ? await readStream(res, contentEl)
        : await readNormal(res, contentEl);
      if (activeRequest === request) history.push({ role: 'assistant', content: reply });
    } catch (err) {
      if (activeRequest !== request) return;
      const errorEl = document.createElement('div');
      errorEl.className = 'error';
      errorEl.textContent = `请求失败：${err.message}`;
      contentEl.appendChild(errorEl);
    } finally {
      if (activeRequest === request) {
        activeRequest = null;
        updateSendButton();
        inputEl.focus();
      }
    }
  }

  async function readNormal(res, contentEl) {
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || '服务返回错误');
    const reply = data.choices?.[0]?.message?.content;
    if (typeof reply !== 'string') throw new Error('响应缺少助手消息内容');
    contentEl.textContent = reply;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return reply;
  }

  async function readStream(res, contentEl) {
    if (!res.body) throw new Error('响应缺少流式内容');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    contentEl.appendChild(cursor);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let reply = '';
    let buffer = '';
    let eventLines = [];
    let completed = false;

    function dispatchEvent() {
      if (!eventLines.length) return;
      const payload = eventLines.join('\n');
      eventLines = [];
      if (payload.trim() === '[DONE]') {
        completed = true;
        return;
      }
      let json;
      try {
        json = JSON.parse(payload);
      } catch {
        throw new Error('流式响应包含无效 JSON');
      }
      if (json.error) throw new Error(json.error.message || '流式服务返回错误');
      const choice = json.choices?.[0];
      const content = choice?.delta?.content;
      if (content != null && typeof content !== 'string') {
        throw new Error('流式消息内容格式错误');
      }
      reply += content ?? '';
      cursor.remove();
      contentEl.textContent = reply;
      contentEl.appendChild(cursor);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function processLine(line) {
      if (line === '') {
        dispatchEvent();
      } else if (line.startsWith('data:')) {
        const value = line.slice(5);
        eventLines.push(value.startsWith(' ') ? value.slice(1) : value);
      }
    }

    function processBuffer(final = false) {
      let index;
      while (!completed && (index = buffer.search(/[\r\n]/)) !== -1) {
        if (!final && buffer[index] === '\r' && index === buffer.length - 1) break;
        const size = buffer[index] === '\r' && buffer[index + 1] === '\n' ? 2 : 1;
        const line = buffer.slice(0, index);
        buffer = buffer.slice(index + size);
        processLine(line);
      }
      if (final && !completed) {
        if (buffer) processLine(buffer);
        buffer = '';
        dispatchEvent();
      }
    }

    try {
      while (!completed) {
        const { done, value } = await reader.read();
        if (done) {
          buffer += decoder.decode();
          processBuffer(true);
          if (!completed) throw new Error('流式响应提前结束，未收到 [DONE]');
          break;
        }
        buffer += decoder.decode(value, { stream: true });
        processBuffer();
      }
      return reply;
    } finally {
      cursor.remove();
      try { await reader.cancel(); } catch { /* 连接已关闭 */ }
      reader.releaseLock();
    }
  }
</script>
</body>
</html>
